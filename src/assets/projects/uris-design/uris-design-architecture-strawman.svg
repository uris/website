<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Uris Design architecture overview</title>
  <desc id="description">A four-layer architecture diagram showing structured portfolio content and high-resolution media flowing through Next.js delivery and image optimization, a realtime session and tool layer, and the Slice-powered workspace UI and state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e8"/>
      <stop offset="1" stop-color="#dce9e7"/>
    </linearGradient>
    <linearGradient id="nextGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f262d"/>
      <stop offset="1" stop-color="#39545b"/>
    </linearGradient>
    <linearGradient id="realtimeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e26d47"/>
      <stop offset="1" stop-color="#b84748"/>
    </linearGradient>
    <linearGradient id="workspaceGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#126d6c"/>
      <stop offset="1" stop-color="#245b80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f262d" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowDark" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#38505a"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 3px; text-transform: uppercase; }
      .heading { font: 700 46px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .subtitle { font: 400 22px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .card-kicker { font: 700 15px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
      .card-title { font: 700 27px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .card-copy { font: 400 19px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .edge-label { font: 700 15px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 0.6px; }
      .note { font: 500 17px 'Avenir Next', 'Trebuchet MS', sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#background)"/>
  <circle cx="1450" cy="96" r="190" fill="#f8c891" opacity="0.35"/>
  <circle cx="125" cy="840" r="260" fill="#9dcaca" opacity="0.32"/>

  <text x="100" y="110" class="eyebrow" fill="#316a69">Uris Design / Architecture</text>
  <text x="100" y="168" class="heading" fill="#1f262d">Fast content. Grounded conversation. One workspace.</text>
  <text x="100" y="208" class="subtitle" fill="#4a5c63">A product-facing view of how portfolio content becomes a realtime, navigation-aware experience.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="300" width="300" height="350" rx="28" fill="#ffffff"/>
    <rect x="440" y="300" width="300" height="350" rx="28" fill="url(#nextGradient)"/>
    <rect x="780" y="300" width="300" height="350" rx="28" fill="url(#realtimeGradient)"/>
    <rect x="1120" y="300" width="380" height="350" rx="28" fill="url(#workspaceGradient)"/>
  </g>

  <text x="136" y="350" class="card-kicker" fill="#46777a">01 / Source</text>
  <text x="136" y="402" class="card-title" fill="#1f262d">Structured content</text>
  <text x="136" y="436" class="card-title" fill="#1f262d">and rich media</text>
  <text x="136" y="492" class="card-copy" fill="#4a5c63">Project JSON</text>
  <text x="136" y="524" class="card-copy" fill="#4a5c63">AI context and tools</text>
  <text x="136" y="556" class="card-copy" fill="#4a5c63">High-resolution visual assets</text>
  <rect x="136" y="590" width="226" height="2" fill="#9ec2c3"/>
  <text x="136" y="622" class="note" fill="#46777a">One source of truth for people</text>
  <text x="136" y="646" class="note" fill="#46777a">and the assistant</text>

  <text x="476" y="350" class="card-kicker" fill="#bde8e4">02 / Delivery</text>
  <text x="476" y="402" class="card-title" fill="#ffffff">Next.js</text>
  <text x="476" y="436" class="card-title" fill="#ffffff">App Router</text>
  <text x="476" y="492" class="card-copy" fill="#e5f3f1">Static project routes</text>
  <text x="476" y="524" class="card-copy" fill="#e5f3f1">Server content transforms</text>
  <text x="476" y="556" class="card-copy" fill="#e5f3f1">next/image optimization</text>
  <rect x="476" y="590" width="226" height="2" fill="#76a7aa"/>
  <text x="476" y="622" class="note" fill="#bde8e4">Fast first render, even when</text>
  <text x="476" y="646" class="note" fill="#bde8e4">the source media is large</text>

  <text x="816" y="350" class="card-kicker" fill="#ffd7c8">03 / Live layer</text>
  <text x="816" y="402" class="card-title" fill="#ffffff">Realtime session</text>
  <text x="816" y="436" class="card-title" fill="#ffffff">and tools</text>
  <text x="816" y="492" class="card-copy" fill="#fff0ea">Session route and API boundary</text>
  <text x="816" y="524" class="card-copy" fill="#fff0ea">WebRTC audio and event channel</text>
  <text x="816" y="556" class="card-copy" fill="#fff0ea">Grounded portfolio actions</text>
  <rect x="816" y="590" width="226" height="2" fill="#f1a889"/>
  <text x="816" y="622" class="note" fill="#ffd7c8">Conversation can retrieve context</text>
  <text x="816" y="646" class="note" fill="#ffd7c8">and guide the visitor</text>

  <text x="1156" y="350" class="card-kicker" fill="#c8eceb">04 / Product</text>
  <text x="1156" y="402" class="card-title" fill="#ffffff">Workspace UI</text>
  <text x="1156" y="436" class="card-title" fill="#ffffff">and state</text>
  <text x="1156" y="492" class="card-copy" fill="#e2f5f4">Conversation, panels, and settings</text>
  <text x="1156" y="524" class="card-copy" fill="#e2f5f4">Zustand lifecycle and response state</text>
  <text x="1156" y="556" class="card-copy" fill="#e2f5f4">Slice layout, media, and WebRTC primitives</text>
  <rect x="1156" y="590" width="304" height="2" fill="#68a8b0"/>
  <text x="1156" y="622" class="note" fill="#c8eceb">Browsing stays first-class;</text>
  <text x="1156" y="646" class="note" fill="#c8eceb">conversation adds a shortcut</text>

  <path d="M 400 474 H 440" stroke="#38505a" stroke-width="5" marker-end="url(#arrowDark)"/>
  <rect x="376" y="440" width="88" height="28" rx="14" fill="#e3f0ee"/>
  <text x="391" y="460" class="edge-label" fill="#38505a">builds</text>

  <path d="M 740 474 H 780" stroke="#38505a" stroke-width="5" marker-end="url(#arrowDark)"/>
  <rect x="709" y="440" width="103" height="28" rx="14" fill="#e3f0ee"/>
  <text x="724" y="460" class="edge-label" fill="#38505a">activates</text>

  <path d="M 1080 474 H 1120" stroke="#38505a" stroke-width="5" marker-end="url(#arrowDark)"/>
  <rect x="1045" y="440" width="110" height="28" rx="14" fill="#e3f0ee"/>
  <text x="1060" y="460" class="edge-label" fill="#38505a">updates</text>

  <g filter="url(#shadow)">
    <rect x="812" y="724" width="428" height="92" rx="22" fill="#1f262d"/>
  </g>
  <text x="846" y="762" class="card-kicker" fill="#9edbd6">External capability</text>
  <text x="846" y="794" class="card-title" fill="#ffffff">OpenAI Realtime API</text>
  <path d="M 930 724 V 650" stroke="#38505a" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowDark)"/>
  <text x="950" y="694" class="edge-label" fill="#38505a">WebRTC session</text>

  <text x="100" y="810" class="note" fill="#4a5c63">Strawman: simplify or expand the labels to match the final visual assets and desired depth of the case study.</text>
</svg>

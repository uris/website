<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Gia trustworthy interaction system</title>
  <desc id="description">A conceptual diagram showing a React workspace, Node.js BFF, expert-reviewed knowledge, SpiceDB permission checks, AI guidance, durable data, and realtime collaborative documents working together to make HR interaction dependable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f4ec"/><stop offset="1" stop-color="#e1edf0"/></linearGradient>
    <linearGradient id="workspace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123842"/><stop offset="1" stop-color="#1c6970"/></linearGradient>
    <linearGradient id="bff" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e36d4c"/><stop offset="1" stop-color="#b64a45"/></linearGradient>
    <linearGradient id="trust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#176b6a"/><stop offset="1" stop-color="#27867c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#18333c" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="#547078"/></marker>
    <style>
      .eyebrow { font: 700 17px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 3px; }
      .heading { font: 700 47px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .sub { font: 400 21px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .kicker { font: 700 14px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 1.8px; }
      .name { font: 700 25px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .copy { font: 400 18px 'Avenir Next', 'Trebuchet MS', sans-serif; }
      .note { font: 600 16px 'Avenir Next', 'Trebuchet MS', sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="205" fill="#f3bd8b" opacity=".33"/><circle cx="105" cy="830" r="280" fill="#9ccdc8" opacity=".25"/>

  <text x="100" y="104" class="eyebrow" fill="#24716f">GIA / TRUSTWORTHY INTERACTION</text>
  <text x="100" y="164" class="heading" fill="#18333c">Trust is visible because the system carries it through.</text>
  <text x="100" y="204" class="sub" fill="#526870">A conceptual, product-facing view - evidence, permissions, and collaboration stay connected to the work.</text>

  <g filter="url(#shadow)"><rect x="100" y="282" width="392" height="222" rx="28" fill="url(#workspace)"/><rect x="604" y="282" width="392" height="222" rx="28" fill="url(#bff)"/><rect x="1108" y="282" width="392" height="222" rx="28" fill="url(#trust)"/></g>
  <text x="136" y="330" class="kicker" fill="#bce8e4">01 / EXPERIENCE</text><text x="136" y="380" class="name" fill="#fff">React workspace</text><text x="136" y="416" class="copy" fill="#e5f6f3">Question, evidence, working artifact,</text><text x="136" y="444" class="copy" fill="#e5f6f3">and next step in one place.</text><text x="136" y="479" class="note" fill="#bce8e4">Professionals keep judgment in the loop</text>
  <text x="640" y="330" class="kicker" fill="#ffe0d2">02 / APPLICATION BOUNDARY</text><text x="640" y="380" class="name" fill="#fff">Node.js BFF</text><text x="640" y="416" class="copy" fill="#fff0eb">Coordinates the workflow and keeps</text><text x="640" y="444" class="copy" fill="#fff0eb">product context at the boundary.</text><text x="640" y="479" class="note" fill="#ffe0d2">One dependable path for every interaction</text>
  <text x="1144" y="330" class="kicker" fill="#d2f3e7">03 / TRUST LAYER</text><text x="1144" y="380" class="name" fill="#fff">Grounded guidance</text><text x="1144" y="416" class="copy" fill="#e9faf3">Expert-reviewed sources, citations,</text><text x="1144" y="444" class="copy" fill="#e9faf3">and clear uncertainty when needed.</text><text x="1144" y="479" class="note" fill="#d2f3e7">Evidence is part of the answer</text>
  <path d="M492 392 H604" stroke="#547078" stroke-width="5" marker-end="url(#arrow)"/><path d="M996 392 H1108" stroke="#547078" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="100" y="610" width="252" height="162" rx="24" fill="#fff"/><rect x="384" y="610" width="252" height="162" rx="24" fill="#fff"/><rect x="668" y="610" width="264" height="162" rx="24" fill="#173a43"/><rect x="964" y="610" width="252" height="162" rx="24" fill="#fff"/><rect x="1248" y="610" width="252" height="162" rx="24" fill="#fff"/></g>
  <text x="128" y="650" class="kicker" fill="#307574">SOURCE FOUNDATION</text><text x="128" y="690" class="name" fill="#18333c">Expert material</text><text x="128" y="722" class="copy" fill="#526870">In-market legal and</text><text x="128" y="748" class="copy" fill="#526870">HR review</text>
  <text x="412" y="650" class="kicker" fill="#307574">AI + RETRIEVAL</text><text x="412" y="690" class="name" fill="#18333c">Answer assembly</text><text x="412" y="722" class="copy" fill="#526870">Contextual guidance</text><text x="412" y="748" class="copy" fill="#526870">with citations</text>
  <text x="696" y="650" class="kicker" fill="#bce8e4">PERMISSIONS</text><text x="696" y="690" class="name" fill="#fff">SpiceDB</text><text x="696" y="722" class="copy" fill="#e5f6f3">Checks who can view,</text><text x="696" y="748" class="copy" fill="#e5f6f3">edit, and share work</text>
  <text x="992" y="650" class="kicker" fill="#307574">PRODUCT STATE</text><text x="992" y="690" class="name" fill="#18333c">Redis + DynamoDB</text><text x="992" y="722" class="copy" fill="#526870">Responsive session state</text><text x="992" y="748" class="copy" fill="#526870">and durable workflow data</text>
  <text x="1276" y="650" class="kicker" fill="#307574">SHARED WORK</text><text x="1276" y="690" class="name" fill="#18333c">Realtime documents</text><text x="1276" y="722" class="copy" fill="#526870">WebSockets and</text><text x="1276" y="748" class="copy" fill="#526870">collaborative editing</text>
  <path d="M226 610 V 548 H800 V504" fill="none" stroke="#6d888f" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><path d="M510 610 V 565 H800 V504" fill="none" stroke="#6d888f" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><path d="M800 610 V 504" fill="none" stroke="#6d888f" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><path d="M1090 610 V 548 H800" fill="none" stroke="#6d888f" stroke-width="3" stroke-dasharray="9 9"/><path d="M1374 610 V 548 H800" fill="none" stroke="#6d888f" stroke-width="3" stroke-dasharray="9 9"/>
  <text x="100" y="838" class="note" fill="#526870">The trust signal is not a screen treatment: it is supported by evidence, scoped access, durable state, and a human review path.</text>
</svg>

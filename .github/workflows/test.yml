name: Website Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload coverage and browser failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-reports
          path: |
            reports/coverage/
            tests/browser/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14

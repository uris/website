name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Add GitHub to known hosts if not already there
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            
            # Clone or pull latest code using SSH
            if [ -d ~/projects/website/.git ]; then
              cd ~/projects/website
              git config pull.rebase false
              GIT_SSH_COMMAND='ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no' git pull origin main
            else
              rm -rf ~/projects/website
              GIT_SSH_COMMAND='ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no' git clone git@github.com:uris/website.git ~/projects/website
            fi
            
            # Rebuild container (using docker-compose with hyphen)
            cd ~/projects
            docker-compose up -d --build website
            docker image prune -f
